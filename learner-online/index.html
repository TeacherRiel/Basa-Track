<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BASA-Track Learner Trial</title><style>html,body{margin:0;height:100%;background:#eef3f8;font-family:Arial,sans-serif}#app{width:100%;height:100vh;border:0;display:block}</style></head><body><iframe id="app" src="../online-test/index.html" title="BASA-Track Learner Trial"></iframe><script>(function(){const f=document.getElementById('app');f.addEventListener('load',()=>{try{const w=f.contentWindow,d=f.contentDocument;const hide=()=>{d.querySelectorAll('button').forEach(b=>{const t=(b.textContent||'').toLowerCase();if(t.includes('teacher dashboard'))b.style.display='none'});const teacher=d.getElementById('teacher');if(teacher)teacher.style.display='none'};hide();new MutationObserver(hide).observe(d.documentElement,{subtree:true,childList:true,attributes:true});}catch(e){console.warn(e)}})})();</script></body></html>
