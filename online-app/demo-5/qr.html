<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BASA-Track Demo QR</title></head><body style="font-family:Arial;text-align:center;padding:40px"><h2>Opening BASA-Track Demo…</h2><p id="m">Please wait.</p><script>(async()=>{const p=new URLSearchParams(location.search),role=p.get('role')==='learner'?'learner':'teacher',id=(p.get('id')||'').toUpperCase();try{await navigator.serviceWorker.register('./demo-sw.js',{scope:'./'});await navigator.serviceWorker.ready;const target=new URL('../BASA_TRACK_PRESENTATION_READY.html',location.href);target.searchParams.set('role',role);if(role==='learner')target.searchParams.set('id',id);location.replace(target.href)}catch(e){document.getElementById('m').textContent='Unable to open demo: '+e.message}})();</script></body></html>
