<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BASA-Track Teacher Demo</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{background:#f4f7fb}#loading{position:fixed;inset:0;display:grid;place-items:center;font:22px Arial;color:#234}iframe{display:block}</style></head><body><div id="loading">Loading BASA-Track Teacher Demo…</div><iframe id="app" hidden src="../BASA_TRACK_PRESENTATION_READY.html"></iframe><script>
const API='https://tpefvuspnvulalhwawqw.supabase.co/functions/v1/basa-track-demo-api';
const R={"DEMO-001":{"name":"Ana Santos","pin":"1001"},"DEMO-002":{"name":"Marco Reyes","pin":"1002"},"DEMO-003":{"name":"Lea Cruz","pin":"1003"},"DEMO-004":{"name":"Carlo Garcia","pin":"1004"},"DEMO-005":{"name":"Mia Dela Cruz","pin":"1005"}};
const app=document.getElementById('app'),loading=document.getElementById('loading');
function state0(){return {logins:0,lastLogin:'—',mar:{done:[],pending:false,approved:false,validated:0},cl:{cp:1,pi:0,pending:false,validated:0,screen:'cover'},pg:{cp:1,pi:0,pending:false,validated:0,screen:'cover'}}}
async function api(action,p={},token=''){const h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify(Object.assign({action},p))});const j=await r.json();if(!r.ok)throw Error(j.error||'Demo server error');return j}
app.addEventListener('load',async()=>{try{const w=app.contentWindow;let D=null;for(let i=0;i<100&&!D;i++){try{D=w.eval('(typeof DATA!=="undefined") ? DATA : null')}catch(e){}if(!D)await new Promise(r=>setTimeout(r,50))}if(!D)throw Error('BASA-Track app data did not initialize');D.learners=R;w.localStorage.setItem('BASA_TRACK_SCHOOL_DEMO_ROSTER_V2',JSON.stringify(R));const login=await api('login',{learner_id:'DEMO-TEACHER',pin:'9090'});w._teacherToken=login.token;w.save=function(d){w.localStorage.setItem('BASA_TRACK_SCHOOL_DEMO_PROGRESS_V1',JSON.stringify(d));for(const id of Object.keys(R))if(d[id])api('update_progress',{learner_id:id,state:d[id]},w._teacherToken).catch(()=>{})};w.teacher=async function(){try{const j=await api('list_pupils',{},w._teacherToken);const d={};for(const p of (j.pupils||[])){const x=p.state||state0();x.name=p.display_name;d[p.learner_id]=x}w.localStorage.setItem('BASA_TRACK_SCHOOL_DEMO_PROGRESS_V1',JSON.stringify(d));D.learners=Object.fromEntries((j.pupils||[]).map(p=>[p.learner_id,{name:p.display_name,pin:R[p.learner_id]?.pin||p.pin}]));w.renderRosterEditor?.();let rows='';for(const p of (j.pupils||[])){const x=d[p.learner_id]||state0(),mc=w.pct(x.mar?.done?.length||0,26),cc=w.pct(x.cl?.validated||0,D.claveria.checkpoints.length),pc=w.pct(x.pg?.validated||0,D.pagbasa.checkpoints.length),a=[];if(x.mar?.pending&&!x.mar?.approved)a.push('<button class="green" onclick="apMar(\''+p.learner_id+'\')">Approve Marungko CP '+((x.mar.validated||0)+1)+'</button>');if(x.cl?.pending)a.push('<button class="green" onclick="apCl(\''+p.learner_id+'\')">Approve Claveria CP '+x.cl.cp+'</button>');if(x.pg?.pending)a.push('<button class="green" onclick="apPg(\''+p.learner_id+'\')">Approve Pagbasa CP '+x.pg.cp+'</button>');rows+='<tr><td><b>'+p.display_name+'</b><br>'+p.learner_id+'</td><td>'+x.lastLogin+'</td><td>Marungko '+mc+'%<br>Claveria '+cc+'%<br>Pagbasa '+pc+'%</td><td>'+(a.length?a.join('<br>'):'No pending approval')+'</td></tr>'}w.document.getElementById('dash').innerHTML='<table><tr><th>Learner</th><th>Last Access</th><th>Progress</th><th>Teacher Validation</th></tr>'+rows+'</table>'}catch(e){w.document.getElementById('dash').innerHTML='<div class="status">⚠️ '+e.message+'</div>'}};w.show('teacher');app.hidden=false;loading.remove()}catch(e){loading.textContent='Unable to load BASA-Track Teacher Demo: '+e.message}});
</script></body></html>
