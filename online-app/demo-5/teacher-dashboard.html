<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BASA-Track Teacher Dashboard Demo</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#18324f}header{background:#315f8f;color:#fff;padding:22px;text-align:center}main{max-width:1050px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px #0001}h1,h2{margin:0 0 8px}button{border:0;border-radius:9px;padding:10px 14px;margin:3px;cursor:pointer;font-weight:700}.green{background:#dff4e5;color:#14532d}.blue{background:#dbeafe;color:#1e3a8a}.red{background:#fee2e2;color:#991b1b}.muted{color:#667085}.status{padding:10px;border-radius:9px;background:#eef6ff;margin:10px 0}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}th{background:#eef4fb}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f7;margin:2px;font-size:12px}.pending{background:#fff3cd;color:#7a5200}.ok{background:#dcfce7;color:#166534}@media(max-width:700px){table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{border:1px solid #e5e7eb;margin-bottom:12px;border-radius:10px;padding:8px}td{border:0}.card{padding:12px}}</style></head><body><header><h1>📚 BASA-TRACK</h1><div>👩‍🏫 Teacher Demo Dashboard</div><small>Marungko • Claveria • Pagbasa sa Filipino</small></header><main><div id="status" class="card">Connecting to BASA-Track demo server…</div><section class="card"><h2>👧 Demo Learners</h2><p class="muted">This is the actual Teacher Dashboard page for the 5-pupil school demo. It is separate from the presentation slides.</p><div id="dash">Loading learner records…</div><button class="blue" onclick="loadDashboard()">🔄 Refresh Dashboard</button><button class="red" onclick="logout()">🚪 Log Out</button></section></main><script>const API='https://tpefvuspnvulalhwawqw.supabase.co/functions/v1/basa-track-demo-api';const statusEl=document.getElementById('status');let token='';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(action,p={}){const h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify(Object.assign({action},p))});const j=await r.json();if(!r.ok)throw Error(j.error||'Demo server error');return j}function pct(v){return Math.max(0,Math.min(100,Number(v)||0))}async function loadDashboard(){try{const j=await api('list_pupils');const pupils=j.pupils||[];let html='<table><thead><tr><th>Learner</th><th>Last Access</th><th>Progress / Validation</th><th>Teacher Action</th></tr></thead><tbody>';for(const p of pupils){const s=p.state||{};const mar=s.mar||{},cl=s.cl||{},pg=s.pg||{};const pending=[];if(mar.pending&&!mar.approved)pending.push('<button class="green" onclick="approve(\''+esc(p.learner_id)+'\',\'mar\')">Approve Marungko</button>');if(cl.pending)pending.push('<button class="green" onclick="approve(\''+esc(p.learner_id)+'\',\'cl\')">Approve Claveria</button>');if(pg.pending)pending.push('<button class="green" onclick="approve(\''+esc(p.learner_id)+'\',\'pg\')">Approve Pagbasa</button>');if(!pending.length)pending.push('<span class="pill ok">No pending validation</span>');html+='<tr><td><b>'+esc(p.display_name||p.learner_id)+'</b><br><span class="pill">'+esc(p.learner_id)+'</span></td><td>'+esc(s.lastLogin||'—')+'</td><td><span class="pill">Marungko lessons: '+esc((mar.done||[]).length)+'</span><span class="pill">Marungko validated: '+esc(mar.validated||0)+'</span><span class="pill">Claveria validated: '+esc(cl.validated||0)+'</span><span class="pill">Pagbasa validated: '+esc(pg.validated||0)+'</span></td><td>'+pending.join('<br>')+'</td></tr>'}html+='</tbody></table>';document.getElementById('dash').innerHTML=html;statusEl.innerHTML='<b>✅ Teacher Demo Connected</b><br>Live learner records loaded from the BASA-Track demo server.'}catch(e){statusEl.innerHTML='<b>⚠️ Connection problem</b><br>'+esc(e.message);document.getElementById('dash').textContent='Unable to load learner records.'}}async function approve(id,kind){try{const j=await api('list_pupils');const p=(j.pupils||[]).find(x=>x.learner_id===id);if(!p)throw Error('Learner not found');const s=p.state||{};if(kind==='mar'){s.mar=s.mar||{};s.mar.pending=false;s.mar.validated=(s.mar.validated||0)+1;s.mar.approved=true}else if(kind==='cl'){s.cl=s.cl||{};s.cl.pending=false;s.cl.validated=(s.cl.validated||0)+1;s.cl.cp=(s.cl.cp||1)+1;s.cl.pi=0}else{s.pg=s.pg||{};s.pg.pending=false;s.pg.validated=(s.pg.validated||0)+1;s.pg.cp=(s.pg.cp||1)+1;s.pg.pi=0}await api('update_progress',{learner_id:id,state:s});await loadDashboard()}catch(e){alert(e.message)}}async function start(){try{const j=await api('login',{learner_id:'DEMO-TEACHER',pin:'9090'});token=j.token||'';await loadDashboard()}catch(e){statusEl.innerHTML='<b>⚠️ Teacher login failed</b><br>'+esc(e.message)}}function logout(){location.reload()}start();</script></body></html>
