<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BASA-Track Learner Demo</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{background:#f4f7fb}#loading{position:fixed;inset:0;display:grid;place-items:center;font:22px Arial;color:#234}iframe{display:block}</style></head><body><div id="loading">Loading BASA-Track Learner Demo…</div><iframe id="app" hidden src="../BASA_TRACK_PRESENTATION_READY.html"></iframe><script>
const API='https://tpefvuspnvulalhwawqw.supabase.co/functions/v1/basa-track-demo-api';
const R={"DEMO-001":{"name":"Ana Santos","pin":"1001"},"DEMO-002":{"name":"Marco Reyes","pin":"1002"},"DEMO-003":{"name":"Lea Cruz","pin":"1003"},"DEMO-004":{"name":"Carlo Garcia","pin":"1004"},"DEMO-005":{"name":"Mia Dela Cruz","pin":"1005"}};
const id=(new URLSearchParams(location.search).get('id')||'DEMO-001').trim().toUpperCase();
const app=document.getElementById('app'),loading=document.getElementById('loading');
async function api(action,p={},token=''){const h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify(Object.assign({action},p))});const j=await r.json();if(!r.ok)throw Error(j.error||'Demo server error');return j}
function hideTeacherDashboard(w){try{const d=w.document;const style=d.createElement('style');style.id='basaLearnerOnly';style.textContent='a,button{ }';d.head.appendChild(style);const remove=()=>{d.querySelectorAll('a,button,[role="button"]').forEach(el=>{const t=(el.textContent||'').replace(/\\s+/g,' ').trim().toLowerCase();if(t.includes('teacher dashboard')||t.includes('teacher demo dashboard'))el.remove()});};remove();const obs=new MutationObserver(remove);obs.observe(d.body,{childList:true,subtree:true});setTimeout(()=>obs.disconnect(),10000)}catch(e){}}
app.addEventListener('load',async()=>{try{const w=app.contentWindow;if(!R[id])throw Error('Unknown demo learner: '+id);w.eval('DATA.learners='+JSON.stringify(R)+';');w.localStorage.setItem('BASA_TRACK_SCHOOL_DEMO_ROSTER_V2',JSON.stringify(R));const login=await api('login',{learner_id:id,pin:R[id].pin});w.current=id;w._learnerToken=login.token;w.window.current=id;const d=w.db();d[id]={logins:login.state.logins,lastLogin:login.state.lastLogin,mar:login.state.mar,cl:login.state.cl,pg:login.state.pg};w.localStorage.setItem('BASA_TRACK_SCHOOL_DEMO_PROGRESS_V1',JSON.stringify(d));w.save=function(s){w.localStorage.setItem('BASA_TRACK_SCHOOL_DEMO_PROGRESS_V1',JSON.stringify(s));const x=s[id];if(x)api('save_progress',{state:{mar:x.mar,cl:x.cl,pg:x.pg}},w._learnerToken).catch(()=>{})};hideTeacherDashboard(w);w.show('learner');w.document.getElementById('welcome').textContent='Kumusta, '+R[id].name+'! 👋';w.learnerHome();hideTeacherDashboard(w);app.hidden=false;loading.remove()}catch(e){loading.textContent='Unable to load BASA-Track Learner Demo: '+e.message}});
</script></body></html>
