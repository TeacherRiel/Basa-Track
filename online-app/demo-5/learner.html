<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BASA-Track Learner Demo</title>
<style>body{margin:0;font-family:Arial,sans-serif}#loading{padding:40px;text-align:center;font-size:22px}</style>
</head><body>
<div id="loading">Loading BASA-Track Learner Demo…</div>
<script>
(async()=>{
 const source='../BASA_TRACK_PRESENTATION_READY.html';
 let html=await fetch(source,{cache:'no-store'}).then(r=>r.text());
 html=html.replaceAll('BASA_TRACK_ROSTER_V2','BASA_TRACK_DEMO_ROSTER_V1')
  .replaceAll('BASA_TRACK_COMBINED_V2','BASA_TRACK_DEMO_DATA_V1')
  .replaceAll('BASA_TRACK_COMBINED_V1','BASA_TRACK_DEMO_DATA_OLD_V1');
 html=html.replace(/const CLASS_ROSTER=\[.*?\];/s,`const CLASS_ROSTER=[\n  ["G1-001","Ana Santos"],\n  ["G1-002","Marco Reyes"],\n  ["G1-003","Lea Cruz"],\n  ["G1-004","Carlo Garcia"],\n  ["G1-005","Mia Dela Cruz"]\n];`);
 html=html.replace(/"learners":\s*\{.*?\}\s*\}/s,`"learners":{\n  "G1-001":{"name":"Ana Santos","pin":"1001"},\n  "G1-002":{"name":"Marco Reyes","pin":"1002"},\n  "G1-003":{"name":"Lea Cruz","pin":"1003"},\n  "G1-004":{"name":"Carlo Garcia","pin":"1004"},\n  "G1-005":{"name":"Mia Dela Cruz","pin":"1005"}\n}}`);
 document.open();document.write(html);document.close();
 setTimeout(()=>{
  // Learner-only route: remove/hide every Teacher Dashboard control and teacher view.
  document.querySelectorAll('button,a').forEach(el=>{
    const t=(el.textContent||'').trim().toLowerCase();
    if(t.includes('teacher dashboard')||t.includes('teacher login')) el.style.display='none';
  });
  const teacherView=document.getElementById('teacher');
  if(teacherView) teacherView.style.display='none';
  const home=document.getElementById('home');
  if(home) home.style.display='none';
  const q=new URLSearchParams(location.search).get('learner');
  if(q&&typeof show==='function'){
    show('login');
    const el=document.getElementById('lid');
    if(el) el.value=q.trim().toUpperCase();
  }
 },100);
})().catch(e=>document.getElementById('loading').textContent='Unable to load BASA-Track learner demo: '+e.message);
</script></body></html>
